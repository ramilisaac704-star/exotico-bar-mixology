<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Exótico — portadas de destacadas y foto de perfil</title>
<style>
  :root{ --negro:#0a0806; --oro:#d9ad52; --oro2:#f3d78c; --oro3:#9c6f1f; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#333;display:flex;flex-wrap:wrap;gap:30px;padding:30px}
  .portada{width:1080px;height:1920px;position:relative;background:radial-gradient(60% 40% at 50% 50%,#1c1407,var(--negro) 75%)}
  /* Instagram recorta un círculo en el centro: todo lo importante vive dentro del aro */
  .aro{position:absolute;left:50%;top:50%;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;
    background:conic-gradient(from 210deg,var(--oro3),var(--oro2),var(--oro),var(--oro3),var(--oro2),var(--oro),var(--oro3));padding:10px}
  .aro::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:2px solid rgba(217,173,82,.45)}
  .disco{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;background:var(--negro);border:14px solid var(--negro)}
  .disco img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.2) brightness(1.25)}
  .disco .oro{position:absolute;inset:0;background:linear-gradient(160deg,#f6d98a,#c8922f 55%,#6b4712);mix-blend-mode:multiply}
  .disco .sombra{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 45%,rgba(10,8,6,.75) 100%)}
  .perfil{width:1080px;height:1080px;background:var(--negro);display:grid;place-items:center}
  .perfil img{width:1000px;height:1000px}
</style>
</head>
<body>
  <section class="portada" id="servicios"><div class="aro"><div class="disco"><img src="../../fotos/g-barra.webp" style="object-position:55% 62%;transform:scale(1.25)" alt=""><div class="oro"></div><div class="sombra"></div></div></div></section>
  <section class="portada" id="bodas"><div class="aro"><div class="disco"><img src="../fuentes/montaje-playa.jpg" style="object-position:50% 78%;transform:scale(1.5);transform-origin:50% 72%" alt=""><div class="oro"></div><div class="sombra"></div></div></div></section>
  <section class="portada" id="eventos"><div class="aro"><div class="disco"><img src="../../fotos/exp-coctel.webp" style="object-position:62% 40%" alt=""><div class="oro"></div><div class="sombra"></div></div></div></section>
  <section class="portada" id="showtending"><div class="aro"><div class="disco"><img src="../../fotos/g-balance.webp" style="object-position:50% 45%" alt=""><div class="oro"></div><div class="sombra"></div></div></div></section>
  <section class="portada" id="molecular"><div class="aro"><div class="disco"><img src="../../fotos/exp-molecular.webp" style="object-position:30% 32%" alt=""><div class="oro"></div><div class="sombra"></div></div></div></section>
  <section class="portada" id="experiencias"><div class="aro"><div class="disco"><img src="../../fotos/hero-poster.jpg" style="object-position:45% 50%" alt=""><div class="oro"></div><div class="sombra"></div></div></div></section>
  <section class="portada" id="galeria"><div class="aro"><div class="disco"><img src="../../fotos/g-pinkpour.webp" style="object-position:50% 55%" alt=""><div class="oro"></div><div class="sombra"></div></div></div></section>
  <section class="portada" id="contacto"><div class="aro"><div class="disco"><img src="../../fotos/g-pour.webp" style="object-position:50% 25%" alt=""><div class="oro"></div><div class="sombra"></div></div></div></section>
  <section class="perfil" id="perfil"><img src="../../fotos/sello.webp" alt="Sello de Exótico Bar & Mixology"></section>
</body>
</html>
