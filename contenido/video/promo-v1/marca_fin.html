<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Outfit:wght@300&display=swap" rel="stylesheet">
<style>
:root{--oro:#d9ad52;--oro2:#f3d78c;--oro3:#9c6f1f;--crema:#f6ecd8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#060504;overflow:hidden;color:var(--crema)}
#fx{position:absolute;inset:0}
.c{position:absolute;left:0;right:0;text-align:center}
.oro{background:linear-gradient(100deg,var(--oro3) 0%,var(--oro) 30%,#fff1c4 50%,var(--oro) 70%,var(--oro3) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
#sello{position:absolute;left:50%;top:430px;width:300px;height:300px;margin-left:-150px;filter:drop-shadow(0 14px 40px rgba(217,173,82,.25))}
#nombre{top:770px;padding-top:.3em;font-family:'Cinzel',serif;font-weight:500;font-size:116px;line-height:1}   /* el relleno superior deja sitio al acento dentro del degradado */
#sub{top:940px;font-family:'Cinzel',serif;font-size:30px;letter-spacing:.56em;padding-left:.56em;color:var(--oro2)}
#linea{position:absolute;left:50%;top:1022px;height:1px;width:0;background:linear-gradient(90deg,transparent,var(--oro),transparent);transform:translateX(-50%)}
#serv{top:1060px;font-family:'Outfit',sans-serif;font-weight:300;font-size:24px;letter-spacing:.24em;padding-left:.24em;white-space:nowrap}
#serv b{color:var(--oro);font-weight:300;margin:0 .45em}
#cta{top:1176px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:46px}
#tel{top:1232px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:96px;color:var(--oro2);letter-spacing:.02em}
#ig{top:1360px;font-family:'Outfit',sans-serif;font-weight:300;font-size:28px;letter-spacing:.08em;opacity:.8}
.marco{position:absolute;left:56px;right:56px;top:200px;bottom:200px;border:1px solid rgba(217,173,82,.42)}
</style></head><body>
<canvas id="fx" width="1080" height="1920"></canvas><div class="marco" id="marco"></div>
<img id="sello" src="../../fotos/sello.webp" alt="">
<div class="c oro" id="nombre">EXÓTICO</div>
<div class="c" id="sub">BAR &amp; MIXOLOGY</div>
<div id="linea"></div>
<div class="c" id="serv">MIXOLOGÍA<b>•</b>SHOWTENDING<b>•</b>EVENTOS</div>
<div class="c" id="cta">Reserva tu fecha por WhatsApp</div>
<div class="c" id="tel">829-320-9581</div>
<div class="c" id="ig">@exotico_mixology</div>
<script>
// render(t) dibuja el fotograma del segundo t (0–3.5). Determinista.
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const seg = (t, a, b) => ease((t - a) / (b - a));
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const P = Array.from({ length: 150 }, (_, i) => ({ x: rnd(i), y: rnd(i + 500), r: 1.2 + rnd(i + 900) * 5, v: 0.02 + rnd(i + 1300) * 0.05, ph: rnd(i + 1700) * 6.28, d: rnd(i + 2100) }));
function particles(t) {
  const c = $('fx').getContext('2d'); c.clearRect(0, 0, 1080, 1920);
  const g = c.createRadialGradient(540, 900, 0, 540, 900, 1000);
  g.addColorStop(0, `rgba(96,64,16,${0.24 * seg(t, 0, 1.0)})`); g.addColorStop(1, 'rgba(6,5,4,0)');
  c.fillStyle = g; c.fillRect(0, 0, 1080, 1920); c.globalCompositeOperation = 'lighter';
  const ap = seg(t, 0, 0.8);
  for (const p of P) {
    const y = ((p.y - p.v * t) % 1 + 1) % 1 * 2040 - 60, x = (p.x + Math.sin(t * 0.7 + p.ph) * 0.02) * 1080;
    const a = ap * (0.55 + 0.45 * Math.sin(t * (1.4 + p.d * 2) + p.ph)) * (0.16 + 0.5 * p.d), r = p.r * (1 + p.d * 2);
    const gr = c.createRadialGradient(x, y, 0, x, y, r * 3);
    gr.addColorStop(0, `rgba(255,226,150,${a})`); gr.addColorStop(0.35, `rgba(217,173,82,${a * 0.5})`); gr.addColorStop(1, 'rgba(217,173,82,0)');
    c.fillStyle = gr; c.beginPath(); c.arc(x, y, r * 3, 0, 6.2832); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
}
function render(t) {
  particles(t);
  $('marco').style.opacity = seg(t, 0.1, 0.9);
  const s = $('sello'); s.style.opacity = seg(t, 0.0, 0.6); s.style.transform = `scale(${0.92 + 0.08 * seg(t, 0, 1.0)})`;
  const n = $('nombre'), k = seg(t, 0.15, 1.15);
  n.style.opacity = k; n.style.letterSpacing = (0.5 - 0.2 * k) + 'em'; n.style.paddingLeft = (0.5 - 0.2 * k) + 'em';
  n.style.backgroundPosition = (100 - cl((t - 0.5) / 2.2) * 100) + '% 0';
  $('sub').style.opacity = seg(t, 0.6, 1.2);
  $('linea').style.width = (560 * seg(t, 0.85, 1.5)) + 'px';
  $('serv').style.opacity = seg(t, 1.1, 1.7);
  for (const [id, a] of [['cta', 1.4], ['tel', 1.6], ['ig', 1.9]]) {
    const e = $(id); const v = seg(t, a, a + 0.55); e.style.opacity = v; e.style.transform = `translateY(${(1 - v) * 16}px)`;
  }
}
render(0);
</script></body></html>
