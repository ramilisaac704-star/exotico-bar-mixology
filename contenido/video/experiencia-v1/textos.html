<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--negro:#0a0806;--oro:#d9ad52;--oro2:#f3d78c;--oro3:#9c6f1f;--crema:#f6ecd8}
*{margin:0;padding:0;box-sizing:border-box}body{background:transparent}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--crema)}
/* Marca fija: arriba, dentro de la zona segura de 250 px */
.velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.55) 0,rgba(10,8,6,0) 18%,rgba(10,8,6,0) 60%,rgba(10,8,6,.45) 80%,rgba(10,8,6,.7) 100%)}
.marca{position:absolute;top:262px;left:0;right:0;text-align:center;font-family:'Cinzel',serif;color:var(--oro2);line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.marca b{display:block;font-weight:500;font-size:38px;letter-spacing:.18em;padding-left:.18em}
.marca span{display:block;font-size:14px;letter-spacing:.5em;margin-top:10px;padding-left:.5em}
/* Titulares: tercio inferior, por encima de los 340 px reservados a la interfaz */
.halo{position:absolute;left:-60px;right:-60px;top:1090px;height:500px;background:radial-gradient(50% 50% at 50% 50%,rgba(8,6,4,.6),rgba(8,6,4,.34) 55%,rgba(8,6,4,0) 100%)}
.bloque{position:absolute;left:70px;right:70px;top:1190px;text-align:center}
.eti{display:flex;align-items:center;justify-content:center;gap:24px;font-family:'Cinzel',serif;font-size:22px;letter-spacing:.42em;color:var(--oro2);padding-left:.42em;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.eti::before,.eti::after{content:"";width:64px;height:1px;background:var(--oro);opacity:.9}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:112px;line-height:1;margin-top:22px;text-shadow:0 3px 8px rgba(0,0,0,.6),0 0 40px rgba(0,0,0,.5)}
em{font-style:italic;font-weight:500;background:linear-gradient(100deg,#f8e2a0,var(--oro) 60%,#b8862e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:.06em;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
/* Tarjeta final */
#fin{background:radial-gradient(85% 50% at 50% 36%,#2a1d08,var(--negro) 72%);text-align:center}
#fin .marco{position:absolute;inset:40px;border:2px solid rgba(217,173,82,.5)}
#fin img{width:400px;height:400px;margin-top:360px;filter:drop-shadow(0 18px 50px rgba(217,173,82,.22))}
#fin .nombre{font-family:'Cinzel',serif;font-weight:500;font-size:62px;letter-spacing:.16em;padding-left:.16em;color:var(--oro2);margin-top:44px}
#fin .sub{font-family:'Cinzel',serif;font-size:19px;letter-spacing:.5em;padding-left:.5em;color:var(--oro);margin-top:12px}
#fin .cta{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:54px;margin-top:66px}
#fin .tel{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:118px;margin-top:4px;color:var(--oro2)}
#fin .zona{font-family:'Cinzel',serif;font-size:21px;letter-spacing:.34em;padding-left:.34em;opacity:.85;margin-top:28px}
#fin .ig{font-family:'Outfit',sans-serif;font-weight:300;font-size:30px;letter-spacing:.06em;margin-top:20px;opacity:.8}
</style></head><body>
<div class="f" id="base"><div class="velo"></div><div class="marca"><b>EXÓTICO</b><span>BAR &amp; MIXOLOGY</span></div></div>
<div class="f" id="t1"><div class="halo"></div><div class="bloque"><h1>No solo preparo<br>cócteles.</h1></div></div>
<div class="f" id="t2"><div class="halo"></div><div class="bloque"><div class="eti">SHOW EN VIVO</div><h1>Creo <em>experiencias.</em></h1></div></div>
<div class="f" id="t3"><div class="halo"></div><div class="bloque"><div class="eti">MIXOLOGÍA DE AUTOR</div><h1>Cada capa,<br><em>a mano.</em></h1></div></div>
<div class="f" id="t4"><div class="halo"></div><div class="bloque"><div class="eti">MIXOLOGÍA MOLECULAR</div><h1>Y el humo<br>llega a <em>tu mesa.</em></h1></div></div>

</body></html>
